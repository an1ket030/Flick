services:
  - type: web
    name: flick-api
    runtime: node
    rootDir: services/api
    buildCommand: cd ../.. && npm install -g pnpm@9.15.4 && pnpm install --frozen-lockfile && cd services/api && pnpm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true
    plan: free
